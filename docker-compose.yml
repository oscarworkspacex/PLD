version: '4'
name: automatizacion
services:
    ####################################################################################################
    # MySQL
    ####################################################################################################
    mysql:
        container_name: mysql_automatizacion
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: automatizacion
            MYSQL_USER: jesus
            MYSQL_PASSWORD: 1234jesus
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"
        # restart: always
    ####################################################################################################
    # PHP
    ####################################################################################################
    php:
        container_name: php_automatizacion
        build: .docker/php
        volumes:
            - .:/var/www:cached
            - ./supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
        depends_on:
            - mysql
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"
        # restart: always
    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx:
        container_name: nginx_automatizacion
        image: nginx
        ports:
            - 0.0.0.0:7654:80
        volumes:
            - .:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"
        # restart: always
volumes:
    mysql_data:
        driver: local

networks:
    oxford_net:
        driver: bridge
